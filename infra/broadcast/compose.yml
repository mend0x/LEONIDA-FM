name: leonida-broadcast

x-runtime: &runtime
  profiles: [streaming, production]
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp:mode=1777]
  logging:
    driver: json-file
    options: { max-size: "5m", max-file: "2" }

services:
  icecast:
    <<: *runtime
    build: { context: ., target: icecast }
    secrets: [source, relay, admin]
    networks: [origin]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as h; h.urlopen('http://127.0.0.1:8000/status-json.xsl', timeout=3).read(512)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
  broadcast-worker:
    <<: *runtime
    build: { context: ., target: playout }
    secrets: [source, dj]
    environment:
      DJ_ENABLED: ${DJ_ENABLED:-0}
    volumes:
      - ../../public/audio:/audio:ro
    networks: [origin]
    depends_on: { icecast: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "python3", "-c", "import json,urllib.request as h; s=json.load(h.urlopen('http://icecast:8000/status-json.xsl',timeout=4))['icestats'].get('source',[]); assert len(s if isinstance(s,list) else [s]) == len(json.load(open('rights.json'))['stations'])"]
      interval: 20s
      timeout: 6s
      retries: 4
      start_period: 40s
  broadcast-gateway:
    <<: *runtime
    build: { context: ., target: gateway }
    ports: ["127.0.0.1:${BROADCAST_PORT:-8088}:8088"]
    networks: [origin, default]
    depends_on: { icecast: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8088/stream/status.json').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
networks:
  origin: { internal: true }
secrets:
  source: { file: .secrets/source }
  relay: { file: .secrets/relay }
  admin: { file: .secrets/admin }
  dj: { file: .secrets/dj }
